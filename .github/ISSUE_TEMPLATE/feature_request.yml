name: 功能建议 / Feature request
description: 提一个新功能或改进 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / The problem
      description: |
        先描述你在读文献时实际卡在哪里，而不是直接描述方案 —— 这样更容易
        找到合适的做法。
      placeholder: 我在读……的时候，每次都要……，很麻烦
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的做法 / What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案 / Alternatives you tried
      description: 现有功能、其他插件、手工流程都算

  - type: dropdown
    id: area
    attributes:
      label: 涉及功能 / Area
      options:
        - 划词查词与翻译 / Selection lookup and translation
        - 整篇双语 HTML / Whole-paper bilingual HTML
        - 工作台与历史 / Workbench and history
        - 术语表 / Glossary
        - 词典 / Dictionary
        - 设置与快捷键 / Settings and shortcuts
        - 阅读器支持（EPUB 等）/ Reader support (EPUB, etc.)
        - 其他 / Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已经搜索过现有 issue 和 README 的"下一步" / I searched existing issues and the roadmap
          required: true
