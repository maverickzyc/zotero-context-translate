# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      all-non-major:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @zotero-plugin/eslint-config declares a peer range of eslint ^9.28.0,
      # so an eslint 10 bump cannot even install. Drop this once the shared
      # config supports eslint 10.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # zotero-plugin-toolkit 5.2.0 moved the ZoteroToolkit export to the
      # `zotero-plugin-toolkit/ztoolkit` subpath, which breaks
      # src/utils/ztoolkit.ts at build time. Upgrading is a one-line import
      # change plus a rebuild, so it should be a deliberate migration rather
      # than an automated bump.
      - dependency-name: "zotero-plugin-toolkit"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # typescript-eslint cannot parse TypeScript 7 yet — the lint job dies with
      # "Cannot read properties of undefined (reading 'Intrinsic')" before it
      # reports a single rule. Drop this once the parser catches up.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
