name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: build-result
          path: .scaffold/build

  # Pure unit tests. No Zotero runtime, no network, a few seconds — this is the
  # job that should tell you whether a change is broken.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run unit tests
        run: npm run test:unit

  # Integration tests inside a real Zotero. Note that zotero-plugin-scaffold
  # downloads the Linux *beta* channel here, which is neither the platform nor
  # the Zotero build most users run, so failures need to be read against that
  # environment before assuming a plugin regression.
  zotero:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Zotero runtime tests
        run: npm run test
