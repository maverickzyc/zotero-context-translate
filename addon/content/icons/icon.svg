<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="88" height="88" rx="20" ry="20" fill="url(#bg)"/>

  <!-- Document/page shape (represents the paper being read) -->
  <rect x="24" y="18" width="38" height="48" rx="4" ry="4" fill="white" opacity="0.9"/>

  <!-- Text lines on document -->
  <line x1="30" y1="28" x2="56" y2="28" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="36" x2="50" y2="36" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="30" y1="44" x2="54" y2="44" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Highlighted line (the selected text) -->
  <rect x="29" y="50" width="28" height="6" rx="1" fill="#818cf8" opacity="0.3"/>
  <line x1="30" y1="53" x2="56" y2="53" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Translation bubble (overlapping, bottom-right) -->
  <rect x="42" y="48" width="34" height="28" rx="6" ry="6" fill="white" stroke="#6366f1" stroke-width="2"/>
  <!-- "A文" symbol - horizontal line with two vertical strokes -->
  <line x1="50" y1="56" x2="68" y2="56" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="63" x2="66" y2="63" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="70" x2="64" y2="70" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Arrow from doc to bubble (context flow) -->
  <circle cx="44" cy="56" r="3" fill="#6366f1"/>
</svg>
