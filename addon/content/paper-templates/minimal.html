<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      :root {
        --bg: #fff;
        --ink: #1c1c1c;
        --muted: #777;
        --line: #e7e7e7;
        --accent: #315efb;
        --zh: #222;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.75 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans SC",
          sans-serif;
      }
      .reader-layout {
        display: grid;
        grid-template-columns: 100px minmax(0, 760px);
        align-items: start;
        justify-content: center;
        gap: 20px;
        padding: 28px 20px 100px;
      }
      .toolbar {
        position: sticky;
        top: 24px;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .mode-control {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .toolbar-label {
        border: 0;
        background: transparent;
        padding: 7px 13px;
        border-radius: 7px;
        cursor: pointer;
        color: var(--muted);
        text-align: center;
      }
      #mode-en:checked ~ .reader-layout .toolbar label[for="mode-en"],
      #mode-zh:checked ~ .reader-layout .toolbar label[for="mode-zh"],
      #mode-both:checked ~ .reader-layout .toolbar label[for="mode-both"] {
        background: #edf1ff;
        color: var(--accent);
      }
      #mode-en:focus-visible ~ .reader-layout .toolbar label[for="mode-en"],
      #mode-zh:focus-visible ~ .reader-layout .toolbar label[for="mode-zh"],
      #mode-both:focus-visible
        ~ .reader-layout
        .toolbar
        label[for="mode-both"] {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      main {
        width: 100%;
        margin: 0;
        padding: 64px 28px 100px;
      }
      header {
        margin-bottom: 3rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.82rem;
      }
      h1 {
        font-size: 2.5rem;
        letter-spacing: -0.04em;
        line-height: 1.16;
      }
      h2 {
        font-size: 1.55rem;
        margin-top: 3rem;
      }
      h3 {
        font-size: 1.15rem;
        margin-top: 2.2rem;
      }
      .bilingual-block > .en,
      .bilingual-block > .zh {
        display: block;
      }
      .bilingual-block > .zh {
        margin-top: 0.2em;
      }
      h1.bilingual-block > .zh {
        font-size: 0.88em;
      }
      .pair {
        margin: 1.4rem 0;
      }
      .pair p {
        margin: 0.3rem 0;
      }
      .zh {
        color: var(--zh);
      }
      blockquote {
        margin: 1.7rem 0;
        padding-left: 1.2rem;
        border-left: 2px solid var(--accent);
        color: #444;
      }
      figure {
        margin: 2.3rem 0;
        text-align: center;
      }
      figure img {
        max-width: 100%;
        height: auto;
      }
      .caption,
      figcaption {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .reference {
        font-size: 0.88rem;
        padding-left: 2em;
        text-indent: -2em;
      }
      .formula,
      .table-fallback {
        overflow: auto;
        padding: 1rem;
        background: #f7f7f7;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 0.55rem;
        text-align: left;
      }
      #mode-en:checked ~ .reader-layout main .zh {
        display: none !important;
      }
      #mode-zh:checked ~ .reader-layout main .en:not(.en-always) {
        display: none !important;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151515;
          --ink: #eee;
          --muted: #999;
          --line: #333;
          --zh: #ddd;
          --accent: #8ca5ff;
        }
        .toolbar {
          background: var(--bg);
        }
        #mode-en:checked ~ .reader-layout .toolbar label[for="mode-en"],
        #mode-zh:checked ~ .reader-layout .toolbar label[for="mode-zh"],
        #mode-both:checked ~ .reader-layout .toolbar label[for="mode-both"] {
          background: #242d4d;
        }
        .formula,
        .table-fallback {
          background: #202020;
        }
      }
      @media (max-width: 940px) {
        .reader-layout {
          display: block;
          padding: 16px 0 0;
        }
        .toolbar {
          position: static;
          width: max-content;
          max-width: calc(100% - 32px);
          margin: 0 auto 16px;
          flex-direction: row;
          justify-content: center;
        }
        main {
          max-width: 760px;
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <input
      class="mode-control"
      type="radio"
      name="language-mode"
      id="mode-en"
    />
    <input
      class="mode-control"
      type="radio"
      name="language-mode"
      id="mode-zh"
    />
    <input
      class="mode-control"
      type="radio"
      name="language-mode"
      id="mode-both"
      checked
    />
    <div class="reader-layout">
      <nav class="toolbar" aria-label="语言显示">
        <label class="toolbar-label" for="mode-en">English</label>
        <label class="toolbar-label" for="mode-zh">中文</label>
        <label class="toolbar-label" for="mode-both">双语</label>
      </nav>
      <main>
        <header><div class="meta">{{META}}</div></header>
        {{BODY}}
      </main>
    </div>
  </body>
</html>
