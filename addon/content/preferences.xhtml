<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      onload="Zotero.ContextTranslate.hooks.onPrefsEvent('load', { window })">
  <linkset>
    <html:link rel="localization" href="context-translate-preferences.ftl" />
  </linkset>

  <!-- LLM Settings -->
  <groupbox>
    <label><html:h2 data-l10n-id="context-translate-prefs-llm-title"></html:h2></label>

    <hbox align="center">
      <label data-l10n-id="context-translate-prefs-llm-baseUrl" control="context-translate-llm-baseUrl" />
      <html:input
        type="text"
        id="context-translate-llm-baseUrl"
        preference="llm.baseUrl"
        flex="1"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="context-translate-prefs-llm-apiKey" control="context-translate-llm-apiKey" />
      <html:input
        type="password"
        id="context-translate-llm-apiKey"
        preference="llm.apiKey"
        flex="1"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="context-translate-prefs-llm-model" control="context-translate-llm-model" />
      <html:input
        type="text"
        id="context-translate-llm-model"
        preference="llm.model"
        flex="1"
      />
    </hbox>

    <hbox align="center">
      <label data-l10n-id="context-translate-prefs-llm-temperature" control="context-translate-llm-temperature" />
      <html:input
        type="text"
        id="context-translate-llm-temperature"
        preference="llm.temperature"
        flex="1"
      />
    </hbox>
  </groupbox>

  <!-- Translation Settings -->
  <groupbox>
    <label><html:h2 data-l10n-id="context-translate-prefs-translate-title"></html:h2></label>

    <hbox align="center">
      <label data-l10n-id="context-translate-prefs-translate-targetLanguage" control="context-translate-translate-targetLanguage" />
      <menulist id="context-translate-translate-targetLanguage" preference="translate.targetLanguage">
        <menupopup>
          <menuitem value="zh-CN" data-l10n-id="context-translate-prefs-translate-lang-zh-CN" />
          <menuitem value="zh-TW" data-l10n-id="context-translate-prefs-translate-lang-zh-TW" />
          <menuitem value="en" data-l10n-id="context-translate-prefs-translate-lang-en" />
          <menuitem value="ja" data-l10n-id="context-translate-prefs-translate-lang-ja" />
        </menupopup>
      </menulist>
    </hbox>

    <checkbox
      id="context-translate-translate-autoMode"
      preference="translate.autoMode"
      data-l10n-id="context-translate-prefs-translate-autoMode"
    />
  </groupbox>

  <!-- Glossary -->
  <groupbox>
    <label><html:h2 data-l10n-id="context-translate-prefs-glossary-title"></html:h2></label>

    <hbox align="center">
      <label id="context-translate-glossary-count" />
    </hbox>

    <hbox>
      <button
        data-l10n-id="context-translate-prefs-glossary-import"
        oncommand="Zotero.ContextTranslate.hooks.onPrefsEvent('importGlossary', { window })"
      />
      <button
        data-l10n-id="context-translate-prefs-glossary-export"
        oncommand="Zotero.ContextTranslate.hooks.onPrefsEvent('exportGlossary', { window })"
      />
    </hbox>
  </groupbox>
</html>
