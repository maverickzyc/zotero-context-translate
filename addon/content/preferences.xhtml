<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
     xmlns:html="http://www.w3.org/1999/xhtml"
     id="context-translate-prefs"
     onload="Zotero.ContextTranslate.hooks.onPrefsEvent('load', { window })">

  <!-- LLM Configuration -->
  <groupbox>
    <label><html:h2>LLM 配置</html:h2></label>

    <hbox align="center" style="margin: 4px 0;">
      <label value="服务商" style="width: 100px;"/>
      <menulist id="context-translate-provider"
                oncommand="Zotero.ContextTranslate.hooks.onPrefsEvent('providerChange', { window, value: this.value })">
        <menupopup id="context-translate-provider-popup">
          <!-- Populated dynamically -->
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" style="margin: 4px 0;">
      <label value="API Base URL" style="width: 100px;"/>
      <html:input type="text" id="context-translate-baseUrl" style="flex: 1;"/>
    </hbox>

    <hbox align="center" style="margin: 4px 0;">
      <label value="API Key" style="width: 100px;"/>
      <html:input type="password" id="context-translate-apiKey" style="flex: 1;"/>
    </hbox>

    <hbox align="center" style="margin: 4px 0;">
      <label value="Model" style="width: 100px;"/>
      <html:input type="text" id="context-translate-model" style="flex: 1;"/>
    </hbox>

    <hbox align="center" style="margin: 4px 0;">
      <label value="Temperature" style="width: 100px;"/>
      <html:input type="text" id="context-translate-temperature" style="width: 80px;"/>
    </hbox>

    <hbox style="margin: 8px 0;">
      <button label="保存配置"
              oncommand="Zotero.ContextTranslate.hooks.onPrefsEvent('saveConfig', { window })"/>
      <label id="context-translate-save-status" value="" style="color: #4ade80; margin-left: 8px;"/>
    </hbox>
  </groupbox>

  <!-- Translation Settings -->
  <groupbox>
    <label><html:h2>翻译设置</html:h2></label>

    <hbox align="center" style="margin: 4px 0;">
      <label value="目标语言" style="width: 100px;"/>
      <menulist id="context-translate-targetLanguage" preference="translate.targetLanguage">
        <menupopup>
          <menuitem label="中文（简体）" value="zh-CN"/>
          <menuitem label="中文（繁體）" value="zh-TW"/>
          <menuitem label="English" value="en"/>
          <menuitem label="日本語" value="ja"/>
        </menupopup>
      </menulist>
    </hbox>

    <hbox align="center" style="margin: 4px 0;">
      <label value="触发方式" style="width: 100px;"/>
      <menulist id="context-translate-triggerMode" preference="translate.triggerMode">
        <menupopup>
          <menuitem label="选中自动翻译" value="auto"/>
          <menuitem label="右键菜单翻译" value="contextmenu"/>
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>

  <!-- Dictionary -->
  <groupbox>
    <label><html:h2>词典管理</html:h2></label>

    <hbox align="center">
      <label id="context-translate-dict-status" value="检查中..."/>
    </hbox>

    <hbox style="margin: 8px 0;">
      <button id="context-translate-dict-download-light" label="下载轻量版 (~4MB, 5万词)"
              oncommand="Zotero.ContextTranslate.hooks.onPrefsEvent('downloadDict', { window, type: 'light' })"/>
      <button id="context-translate-dict-download-full" label="下载完整版 (~30MB, 77万词)"
              oncommand="Zotero.ContextTranslate.hooks.onPrefsEvent('downloadDict', { window, type: 'full' })"/>
    </hbox>

    <label id="context-translate-dict-progress" value="" style="color: #888;"/>
  </groupbox>

  <!-- Glossary -->
  <groupbox>
    <label><html:h2>术语表</html:h2></label>

    <hbox align="center">
      <label id="context-translate-glossary-count" value="术语数: 0 条"/>
      <spacer flex="1"/>
      <button label="导入 CSV" oncommand="Zotero.ContextTranslate.hooks.onPrefsEvent('importGlossary', { window })"/>
      <button label="导出 CSV" oncommand="Zotero.ContextTranslate.hooks.onPrefsEvent('exportGlossary', { window })"/>
    </hbox>
  </groupbox>

</vbox>
